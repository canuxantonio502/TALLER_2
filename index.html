<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Movie Explorer</title>
    <link rel="icon" href="./css/assets/logoIMG.png" type="image/png">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <header class="header">
        <button class="menu-btn">
            <img id="logoImg" src="./css/assets/logoIMG.png" alt="Logo Campuslands Movie Explorer"></i>
        </button>
        <h1 class="name">
            Campus Movie Explorer
        </h1>
        <form class="search-form">
            <input type="text" placeholder="Buscar película..." class="search-input">
            <button class="search-btn">
                <img src="./css/assets/search_icon.png" alt="ícono de búsqueda" class="icon">
            </button>
        </form>
    </header>

    <aside class="sidebar">
        <ul class="category-list">
            <li data-category="popular">🔥 Popular</li>
            <li data-category="top_rated">⭐ Top Rated</li>
            <li data-category="upcoming">🎬 Upcoming</li>
            <li data-category="now_playing">▶️ Now Playing</li>
        </ul>
    </aside>

    <main class="main-content">
        <section class="loading hidden">
            <div class="spinner"></div>
            <p>Cargando películas...</p>
        </section>
        <section class="error-message hidden">
        </section>
        <section class="movies-container">
            <!-- Aquí se insertarán las películas dinámicamente -->
        </section>
    </main>
    <!-- Modal -->
    <section class="movie-modal hidden">
        <div class="modal-content">
            <button class="close-modal">
                <img src="./css/assets/close_icon.png" alt="close boton" class="icon">
            </button>
            <div class="modal-body">
            </div>
        </div>
    </section>

    <footer class="footer">
        <p id="last">&copy; Proyecto realizado con la API de TMDB</p>
    </footer>

    <!-- JavaScript -->
    <script type="module" src="./js/app.js"></script>
</body>

</html>
